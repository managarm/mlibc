name: Rust libc bindings

on: [pull_request, merge_group]

jobs:
    check-bindings:
        name: Verify bindings generation
        runs-on: ubuntu-latest
        container: debian:trixie
        steps:
          - name: Install prerequisites
            run: |
                apt-get update
                apt-get install -y meson ninja-build \
                                python3-setuptools python3-jsonschema \
                                python3-pexpect python3-pip \
                                netbase clang lld rustup git rsync
                pip install --break-system-packages -U xbstrap pyexpect
                rustup default stable
                rustup component add rustfmt
          - name: Prepare directories
            run: |
                mkdir src/
                mkdir src/mlibc/
                mkdir build/
          - name: Checkout
            uses: actions/checkout@v6
            with:
              path: src/mlibc/
          - name: Prepare src/
            run: |
                cp mlibc/ci/bootstrap.yml .
                touch mlibc/checkedout.xbstrap
            working-directory: src/
          - name: Prepare build/
            run: |
              cat > bootstrap-site.yml << EOF
              define_options:
                arch: x86_64
                compiler: gcc
              EOF
              xbstrap init ../src
            working-directory: build/
          - name: Build mlibc
            run: 'xbstrap install mlibc-headers-only'
            working-directory: build/
          - name: Checkout rust-libc
            uses: actions/checkout@v6
            with:
                repository: rust-lang/libc
                path: src/rust-libc/
          - name: Run generator
            run: |
                cargo run -- -m ../../../rust-libc/src/unix/linux_like/managarm/mod.rs --headers-dir ../../../../build/packages/mlibc-headers-only/usr/include -I ../../../../build/packages/linux-headers/usr/include -c ../../sysdeps/managarm/rust/managarm.yml -p ../../sysdeps/managarm/rust/defs.rs --target x86_64-unknown-managarm
            working-directory: src/mlibc/scripts/libc-parser

